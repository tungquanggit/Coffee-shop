<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hệ Thống Quản Lý Quán Cà Phê</title>

    <link rel="stylesheet" href="css/qly.css">
</head>
<body>

    <!-- MAIN -->
    <div id="mainApp" class="app hidden">

        <aside class="sidebar">

            <h2>☕ Brew & Co.</h2>

            <button onclick="showPage('dashboard')">
                Dashboard
            </button>

            <button onclick="showPage('menu')">
                Menu
            </button>

            <button onclick="showPage('tables')">
                Bàn
            </button>

            <button onclick="showPage('employees')">
                Nhân viên
            </button>

            <button onclick="showPage('orders')">
                Lịch sử đơn hàng
            </button>

            <button onclick="showPage('report')">
                Doanh thu
            </button>

            <button
            id="adminBtn"
            onclick="window.location.href='index.html'">
            ⚙ Đăng Xuất
        </button>

        </aside>

        <main class="content">

            <!-- DASHBOARD -->
            <section id="dashboard" class="page active">

                <h2>Tổng quan</h2>

                <div class="cards">

                    <div class="card">
                        <h3>Doanh thu</h3>
                        <p id="revenueValue">
                            0 ₫
                        </p>
                    </div>

                    <div class="card">
                        <h3>Đơn hàng</h3>
                        <p id="orderCount">
                            0
                        </p>
                    </div>

                    <div class="card">
                        <h3>Bàn</h3>
                        <p id="tableCount">
                            0
                        </p>
                    </div>

                    <div class="card">
                        <h3>Nhân viên</h3>
                        <p id="employeeCount">
                            0
                        </p>
                    </div>

                </div>

            </section>

            <!-- MENU -->
            <section id="menu" class="page">

                <div class="header-row">
                    <h2>Quản lý Menu</h2>

                    <button onclick="openMenuModal()">
                        + Thêm món
                    </button>
                </div>

                <input
                    type="text"
                    id="menuSearch"
                    placeholder="Tìm món..."
                    onkeyup="searchMenu()">

                <table>

                    <thead>
                        <tr>
                            <th>Tên món</th>
                            <th>Giá</th>
                            <th>Thao tác</th>
                        </tr>
                    </thead>

                    <tbody id="menuTable">
                    </tbody>

                </table>

            </section>

            <!-- TABLES -->
             <!-- TABLES -->
<section id="tables" class="page">

    <div class="table-top">

        <h2>📋 Quản Lý Bàn</h2>

        <div id="tableStats"></div>

        <button onclick="addTable()">
            ➕ Thêm Bàn
        </button>

    </div>

    <div id="tableGrid"></div>

</section>

            <!-- EMPLOYEE -->
            <section id="employees" class="page">

                <div class="header-row">
                    <h2>Nhân viên</h2>

                    <button onclick="openEmployeeModal()">
                        + Thêm nhân viên
                    </button>
                </div>

                <table>

                    <thead>
                        <tr>
                            <th>Họ tên</th>
                            <th>Chức vụ</th>
                            <th>Ca làm</th>
                            <th>Lương</th>
                        </tr>
                    </thead>

                    <tbody id="employeeTable">
                    </tbody>

                </table>

            </section>

            <!-- ORDERS -->
            <section id="orders" class="page">

                <h2>Lịch sử</h2>

                <div id="menuOrderList"></div>

                <div id="currentOrder"></div>


            </section>

            <!-- REPORT -->
            <section id="report" class="page">

                <h2>Thống kê doanh thu</h2>

                <canvas id="revenueChart"></canvas>

            </section>

        </main>

    </div>

    <script src="js/login.js"></script>
    <script src="js/menu.js"></script>
    <script src="js/table.js"></script>
    <script src="js/employee.js"></script>
    <script src="js/order.js"></script>
    <script src="js/dashboard.js"></script>
    <script src="js/app.js"></script>

</body>
</html>
